name: Toolkit Modules Build
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      environment:
        description: 'Environment mammoth'
        required: false
        default: 'build'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.13'  # Specify the required Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Give execute permission to script.sh
        run: chmod +x components_script.sh

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Modules
        run: ./components_script.sh

      - name: Store module yaml artifacts
        uses: actions/upload-artifact@v4
        with:
          name: module_yamls
          path: yamls/
          compression-level: 9

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download yamls artifact
        uses: actions/download-artifact@v4
        with:
          name: module_yamls
          path: yamls

      - name: Compress yamls folder
        run: tar -czf module_yamls.tar.gz yamls

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Toolkit Modules Release v${{ github.run_number }}
          body: |
            This release contains the built module YAMLs.
          files: module_yamls.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
